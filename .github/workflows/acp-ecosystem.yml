name: ACP ecosystem compatibility

on:
  schedule:
    # Weekly early warning without making mutable third-party CLIs a PR gate.
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test
  CI_OTP_VERSION: '27.0'
  CI_ELIXIR_VERSION: '1.17.3'

jobs:
  drift:
    name: Catalog and adapter upstream drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
      with:
        otp-version: ${{ env.CI_OTP_VERSION }}
        elixir-version: ${{ env.CI_ELIXIR_VERSION }}

    - name: Restore deps/_build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-acp-compat-${{ env.CI_OTP_VERSION }}-${{ env.CI_ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-acp-compat-${{ env.CI_OTP_VERSION }}-${{ env.CI_ELIXIR_VERSION }}-

    - name: Install dependencies
      run: mix deps.get

    - name: Check ACP catalogs and reference adapters
      run: mix acp.compat.check
      env:
        GITHUB_TOKEN: ${{ github.token }}

  matrix:
    name: Build reviewed smoke matrix
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.agents.outputs.agents }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - id: agents
      name: Read reviewed manifest entries
      shell: bash
      run: |
        echo "agents=$(jq -c '[.interopAgents[] | {id: .id}]' test/interop/acp_compatibility.json)" >> "$GITHUB_OUTPUT"

  smoke:
    name: Native ACP smoke (${{ matrix.agent.id }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.matrix.outputs.agents) }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
      with:
        otp-version: ${{ env.CI_OTP_VERSION }}
        elixir-version: ${{ env.CI_ELIXIR_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '22'

    - name: Restore deps/_build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-acp-smoke-${{ env.CI_OTP_VERSION }}-${{ env.CI_ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-acp-smoke-${{ env.CI_OTP_VERSION }}-${{ env.CI_ELIXIR_VERSION }}-

    - name: Install dependencies
      run: mix deps.get

    - name: Run reviewed credential-free initialization
      run: mix test --only interop_acp_ecosystem
      env:
        ACP_ECOSYSTEM_AGENT_ID: ${{ matrix.agent.id }}
